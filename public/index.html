<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CareCenter Insights</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/charts.css" />
    <link rel="stylesheet" href="styles/medication_workflow.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="page-header">
        <p class="eyebrow">NHANES · 1988–2018</p>
        <h1>CareCenter Insights</h1>
        <p class="intro">
          Explore health, medication, and dietary trends from the survey
          database. Charts describe loaded survey records and are unweighted.
        </p>
        <p id="dashboardStatus" class="status" role="status" aria-live="polite">
          Loading chart data…
        </p>
      </header>

      <div id="surveyCharts"></div>
      <div id="medicationWorkflow"></div>
      <noscript>Enable JavaScript to load the charts and medication workflow.</noscript>
    </main>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
