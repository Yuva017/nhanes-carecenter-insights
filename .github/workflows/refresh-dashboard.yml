name: Refresh dashboard data

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exporter dependencies
        run: python -m pip install pandas sqlalchemy psycopg2-binary python-dotenv pyyaml

      - name: Export aggregate chart data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.analytics.export

      - name: Validate chart data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.analytics.export import ANALYTICS

          for dataset in ANALYTICS:
              filename = f"{dataset}.json"
              path = Path("public/data") / filename
              rows = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(rows, list):
                  raise SystemExit(f"{path} must contain a JSON array")
              print(f"{filename}: {len(rows)} aggregate rows")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
