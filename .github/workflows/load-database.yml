name: Load NHANES database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhanes-etl
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download NHANES CSV files
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -m scripts.fetch_dataset

      - name: Load configured dataset sample into PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.run_pipeline

      - name: Show loaded table counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.check_counts
